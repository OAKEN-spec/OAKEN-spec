[profile.default]
src = "contracts"
test = "test/foundry"
out = "foundry-out"
cache_path = "foundry-cache"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
auto_detect_solc = false

[fuzz]
runs = 1000
fail_on_revert = false

[invariant]
runs = 128
depth = 64
fail_on_revert = false
